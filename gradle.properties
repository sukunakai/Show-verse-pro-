# JVM & Encoding Configuration
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
systemProp.file.encoding=UTF-8

# Use modern AndroidX
android.useAndroidX=true

# CRITICAL FIX: Turn off Jetifier!
# When Jetifier is enabled or left unconfigured, it attempts to rewrite
# modern AAR dependencies (such as Media3 / ExoPlayer) during resource processing.
# In AGP 8+, this mutates debugCompileClasspath while task :app:processDebugResources is running,
# throwing: "Cannot mutate the dependencies of configuration ':app:debugCompileClasspath' after the configuration has been resolved".
# Disabling Jetifier completely eliminates this mutation conflict.
android.enableJetifier=false

# Modern Android Gradle Plugin & Kotlin Optimizations
android.nonTransitiveRClass=true
org.gradle.parallel=true
org.gradle.caching=true
kotlin.incremental=true
