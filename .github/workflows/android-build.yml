name: StreamX Native Android CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode Google Services JSON
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
            echo "google-services.json decoded successfully in app/"
          else
            echo "WARNING: GOOGLE_SERVICES_JSON secret not found. Using default schema configuration."
            if [ ! -f "app/google-services.json" ]; then
              echo '{"project_info":{"project_number":"123","project_id":"streamx-app","storage_bucket":"streamx.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:123","android_client_info":{"package_name":"com.streamx.app"}},"api_key":[{"current_key":"placeholder"}]}]}' > app/google-services.json
            fi
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew || true

      - name: Build Debug & Release APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace
          else
            gradle assembleDebug assembleRelease --no-daemon --stacktrace
          fi

      - name: Sign Release APK
        run: |
          keytool -genkey -v -keystore release.jks -alias streamx -keyalg RSA -keysize 2048 -validity 10000 -storepass streamx123 -keypass streamx123 -dname "CN=StreamX, OU=Mobile, O=StreamX, L=City, S=State, C=US"
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*unsigned.apk" | head -n 1)
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          if [ -f "$UNSIGNED_APK" ] && [ -n "$APKSIGNER" ]; then
            echo "Signing $UNSIGNED_APK with $APKSIGNER..."
            $APKSIGNER sign --ks release.jks --ks-pass pass:streamx123 --key-pass pass:streamx123 --out app/build/outputs/apk/release/StreamX-release-signed.apk "$UNSIGNED_APK"
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamX-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamX-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
