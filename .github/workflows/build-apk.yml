name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Vite web app
        run: npm run build

      - name: Install Capacitor and Setup Android Project
        run: |
          npm install --legacy-peer-deps @capacitor/core@^6.2.0 @capacitor/android@^6.2.0 @capacitor/cli@^6.2.0
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Apply Custom ShowVerse App Icons & Native 120 FPS Optimizations
        run: |
          node scripts/generate-icons.js
          node scripts/native-optimize.js

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug & Release APKs with Gradle
        run: |
          cd android
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Sign Release APK for Direct Installation
        run: |
          keytool -genkey -v -keystore release.jks -alias showverse -keyalg RSA -keysize 2048 -validity 10000 -storepass showverse123 -keypass showverse123 -dname "CN=ShowVerse, OU=Mobile, O=ShowVerse, L=City, S=State, C=US"
          UNSIGNED_APK=$(find android/app/build/outputs/apk/release -name "*unsigned.apk" | head -n 1)
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          if [ -f "$UNSIGNED_APK" ] && [ -n "$APKSIGNER" ]; then
            echo "Signing $UNSIGNED_APK with $APKSIGNER..."
            $APKSIGNER sign --ks release.jks --ks-pass pass:showverse123 --key-pass pass:showverse123 --out android/app/build/outputs/apk/release/ShowVerse-release-signed.apk "$UNSIGNED_APK"
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ShowVerse-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ShowVerse-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30



