<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="70%" stop-color="#060913" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>
    <linearGradient id="neonCyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.4" />
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="32" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  
  <!-- Outer Glow Ring -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="url(#ringGrad)" stroke-width="4" opacity="0.6" />

  <!-- Inner Ambient Aura -->
  <circle cx="256" cy="256" r="140" fill="#00F0FF" opacity="0.08" filter="url(#neonGlow)" />
  
  <!-- ShowVerse Hexagon / Shield Frame -->
  <path d="M256 96 L392 176 V336 L256 416 L120 336 V176 Z" 
        fill="#070c18" 
        stroke="url(#neonCyanPurple)" 
        stroke-width="8" 
        stroke-linejoin="round"
        filter="url(#neonGlow)" />

  <!-- Play Symbol ("S" & Play Fusion) -->
  <polygon points="216,184 344,256 216,328" fill="url(#neonCyanPurple)" filter="url(#neonGlow)" />

  <!-- Core Highlights -->
  <circle cx="256" cy="256" r="12" fill="#FFFFFF" opacity="0.9" />
</svg>
